app = "trackguests3-aged-night-5724"
kill_signal = "SIGTERM"
primary_region = "ewr"

[deploy]
release_command = "/app/bin/migrate"

[env]
PHX_HOST = "trackguests3-aged-night-5724.fly.dev"
PORT = "8080"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8_080
min_machines_running = 0
processes = [ "app" ]

  [http_service.concurrency]
  hard_limit = 1_000
  soft_limit = 1_000
  type = "connections"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"

